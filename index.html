<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>部門リーダーの道</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--sub:#747b85;--line:#e4e7eb;--accent:#1d2735;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{padding:calc(20px + env(safe-area-inset-top)) 18px 18px;background:#fff;border-bottom:1px solid var(--line)}header h1{font-size:23px;margin:0 0 5px}header p{margin:0;color:var(--sub);font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px 14px 80px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:9px}.row>*{flex:1}label{display:block;font-size:12px;color:var(--sub);margin:0 0 6px}input,textarea,select{width:100%;border:1px solid #d7dbe0;background:#fff;border-radius:10px;padding:11px;font:inherit;color:inherit}textarea{min-height:92px;resize:vertical}button{border:0;border-radius:10px;padding:11px 14px;font-weight:650;font-size:14px;cursor:pointer}.primary{background:var(--accent);color:#fff}.soft{background:#eef0f3;color:#303641}.danger{background:#fff0ef;color:var(--danger)}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:8px}.sectionTitle h2{font-size:18px;margin:0}.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.itemHead{display:flex;gap:8px;align-items:center}.itemHead input{font-weight:700;font-size:16px}.sub{margin-top:10px;padding:11px;background:#f7f8fa;border-radius:11px}.subHead{display:flex;justify-content:space-between;gap:8px;align-items:center}.subHead input{font-weight:650;background:transparent}.sub textarea{margin-top:7px;background:#fff}.tiny{padding:8px 10px;font-size:12px}.empty{text-align:center;color:var(--sub);padding:28px 8px;font-size:14px}.saved{font-size:12px;color:var(--sub);margin-top:8px}.storeTitle{font-weight:750;font-size:16px;margin-bottom:2px}.deptTitle{font-size:13px;color:var(--sub)}@media(max-width:540px){.row{display:block}.row>*+*{margin-top:10px}}
</style>
</head>
<body><header><h1>部門リーダーの道</h1><p>前年超えと実績向上のための覚書</p></header><main class="wrap">
<div class="card"><div class="row"><div><label>店舗名</label><input id="store" placeholder="例：ミッテン府中店"></div><div><label>部門名</label><input id="dept" placeholder="例：情報部門"></div></div><div class="actions"><button class="primary" onclick="openWorkspace()">保存して開く</button><select id="savedSelect" onchange="loadSelected()"><option value="">保存済みから選択</option></select></div><div class="saved">店舗 → 部門の単位で、この端末に保存します。</div></div>
<div id="workspace" style="display:none"><div class="card"><div class="sectionTitle"><div><div class="storeTitle" id="wsStore"></div><div class="deptTitle" id="wsDept"></div></div><button class="primary" onclick="addItem()">＋ 項目追加</button></div><div id="items"></div></div></div>
</main>
<script>
const KEY='bumonLeaderData_v1';let current=null;let data=read();
function read(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));refreshSelect()}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function refreshSelect(){const s=document.getElementById('savedSelect');s.innerHTML='<option value="">保存済みから選択</option>';Object.keys(data).sort().forEach(store=>Object.keys(data[store]).sort().forEach(dept=>{let o=document.createElement('option');o.value=JSON.stringify([store,dept]);o.textContent=store+' / '+dept;s.appendChild(o)}))}
function openWorkspace(){let store=document.getElementById('store').value.trim(),dept=document.getElementById('dept').value.trim();if(!store||!dept){alert('店舗名と部門名を入力してください');return}data[store]??={};data[store][dept]??={items:[]};current=[store,dept];persist();render()}
function loadSelected(){let v=document.getElementById('savedSelect').value;if(!v)return;current=JSON.parse(v);document.getElementById('store').value=current[0];document.getElementById('dept').value=current[1];render()}
function model(){return data[current[0]][current[1]]}
function addItem(){let name=prompt('項目名を入力\n例：ゲーム、PC、スマートウォッチ');if(!name?.trim())return;model().items.push({id:id(),name:name.trim(),subs:[{id:id(),title:'前提',text:''}]});persist();render()}
function addSub(itemId){let item=model().items.find(x=>x.id===itemId);item.subs.push({id:id(),title:'新しい小項目',text:''});persist();render()}
function updateItem(itemId,val){model().items.find(x=>x.id===itemId).name=val;persist()}
function updateSub(itemId,subId,key,val){let sub=model().items.find(x=>x.id===itemId).subs.find(x=>x.id===subId);sub[key]=val;persist()}
function removeItem(itemId){if(!confirm('この項目を削除しますか？'))return;model().items=model().items.filter(x=>x.id!==itemId);persist();render()}
function removeSub(itemId,subId){let item=model().items.find(x=>x.id===itemId);let sub=item.subs.find(x=>x.id===subId);if(sub.title==='前提'){alert('「前提」は基本小項目のため削除できません');return}item.subs=item.subs.filter(x=>x.id!==subId);persist();render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.getElementById('workspace').style.display='block';document.getElementById('wsStore').textContent=current[0];document.getElementById('wsDept').textContent=current[1];let root=document.getElementById('items'),items=model().items;if(!items.length){root.innerHTML='<div class="empty">まだ項目がありません。<br>「＋ 項目追加」からゲーム・PCなどを追加できます。</div>';return}root.innerHTML=items.map(item=>`<div class="item"><div class="itemHead"><input value="${esc(item.name)}" onchange="updateItem('${item.id}',this.value)"><button class="danger tiny" onclick="removeItem('${item.id}')">削除</button></div>${item.subs.map(sub=>`<div class="sub"><div class="subHead"><input value="${esc(sub.title)}" ${sub.title==='前提'?'readonly':''} onchange="updateSub('${item.id}','${sub.id}','title',this.value)">${sub.title==='前提'?'':`<button class="danger tiny" onclick="removeSub('${item.id}','${sub.id}')">削除</button>`}</div><textarea placeholder="ここに施策・考え方・確認事項を記載" oninput="updateSub('${item.id}','${sub.id}','text',this.value)">${esc(sub.text)}</textarea></div>`).join('')}<div class="actions"><button class="soft" onclick="addSub('${item.id}')">＋ 小項目を追加</button></div></div>`).join('')}
refreshSelect();
</script></body></html>
