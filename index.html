<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>部門リーダーの道</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#15171a;--sub:#747b85;--line:#e4e7eb;--accent:#1d2735;--danger:#b42318;--ok:#137333}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:#fff;border-bottom:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top)) 16px 16px}.head{max-width:760px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.brand h1{font-size:23px;margin:0 0 5px;white-space:nowrap}.brand p{margin:0;color:var(--sub);font-size:13px}.switcher{display:flex;gap:6px;align-items:center;min-width:0}.switcher input{border:1px solid #d7dbe0;border-radius:9px;padding:9px 8px;font:inherit;background:#fff}.switcher .code{width:68px;text-align:center;font-weight:750}.switcher .dept{width:105px}.wrap{max-width:760px;margin:auto;padding:16px 14px 80px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #00000008}input,textarea{width:100%;border:1px solid #d7dbe0;background:#fff;border-radius:10px;padding:11px;font:inherit;color:inherit}textarea{min-height:92px;resize:vertical}button{border:0;border-radius:10px;padding:11px 14px;font-weight:650;font-size:14px;cursor:pointer}.primary{background:var(--accent);color:#fff}.soft{background:#eef0f3;color:#303641}.danger{background:#fff0ef;color:var(--danger)}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:8px}.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.itemHead{display:flex;gap:8px;align-items:center}.itemHead input{font-weight:700;font-size:16px}.sub{margin-top:10px;padding:11px;background:#f7f8fa;border-radius:11px}.subHead{display:flex;justify-content:space-between;gap:8px;align-items:center}.subHead input{font-weight:650;background:transparent}.sub textarea{margin-top:7px;background:#fff}.tiny{padding:8px 10px;font-size:12px}.empty{text-align:center;color:var(--sub);padding:34px 8px;font-size:14px;line-height:1.7}.storeTitle{font-weight:800;font-size:18px}.deptTitle{font-size:13px;color:var(--sub);margin-top:3px}.status{font-size:12px;color:var(--sub);margin-top:9px}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}#workspace{display:none}@media(max-width:540px){.head{align-items:flex-start}.brand h1{font-size:20px}.brand p{font-size:11px}.switcher{gap:4px}.switcher .code{width:60px}.switcher .dept{width:90px;padding-left:7px;padding-right:7px}}
</style>
</head>
<body>
<header><div class="head"><div class="brand"><h1>部門リーダーの道</h1><p>前年超えと実績向上のための覚書</p></div><div><div class="switcher"><input id="storeCode" class="code" inputmode="numeric" maxlength="3" placeholder="000" aria-label="3桁番号"><input id="department" class="dept" maxlength="80" placeholder="部門名" aria-label="部門名"></div><div id="syncStatus" class="status">3桁＋部門名で自動読込</div></div></div></header>
<main class="wrap"><div id="workspace"><div class="card"><div class="sectionTitle"><div><div class="storeTitle" id="wsTitle"></div><div class="deptTitle">Supabaseで端末間同期</div></div><button class="primary" onclick="addItem()">＋ 項目追加</button></div><div id="items"></div></div></div><div id="guide" class="card empty">右上に「3桁の数値」と「部門名」を入力すると、<br>その組み合わせのデータを自動で開きます。</div></main>
<script>
const SUPABASE_URL='https://gwmwynjkhxaywknhakcw.supabase.co';
const SUPABASE_KEY='sb_publishable_lGmCtn4giQA0585yjQb5yw_a9ptkN6Q';
const TABLE='bumon_leader_workspaces';
let current=null, currentKey='', items=[], loadTimer=null, saveTimer=null, loadSeq=0;
const codeEl=document.getElementById('storeCode'),deptEl=document.getElementById('department'),statusEl=document.getElementById('syncStatus');
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setStatus(text,type=''){statusEl.textContent=text;statusEl.className='status '+type}
async function sha256(text){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function normalize(){codeEl.value=codeEl.value.replace(/\D/g,'').slice(0,3);return {code:codeEl.value,dept:deptEl.value.trim()}}
function scheduleOpen(){normalize();clearTimeout(loadTimer);loadTimer=setTimeout(openFromInputs,450)}
codeEl.addEventListener('input',scheduleOpen);deptEl.addEventListener('input',scheduleOpen);
async function openFromInputs(){const {code,dept}=normalize();if(code.length!==3||!dept){current=null;currentKey='';document.getElementById('workspace').style.display='none';document.getElementById('guide').style.display='block';setStatus('3桁＋部門名で自動読込');return}const seq=++loadSeq;setStatus('読み込み中…');const key=await sha256(code+'|'+dept);try{const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=store_code,department_name,items&workspace_key=eq.${key}`,{headers:{apikey:SUPABASE_KEY,'x-workspace-key':key}});if(!r.ok)throw new Error(await r.text());const rows=await r.json();if(seq!==loadSeq)return;current={code,dept};currentKey=key;items=Array.isArray(rows[0]?.items)?rows[0].items:[];localStorage.setItem('bumonLeaderLast',JSON.stringify({code,dept}));render();setStatus(rows.length?'同期済み':'新規データ','ok')}catch(e){console.error(e);setStatus('読み込み失敗','err')}}
function scheduleSave(){if(!current||!currentKey)return;clearTimeout(saveTimer);setStatus('保存中…');saveTimer=setTimeout(saveNow,500)}
async function saveNow(){if(!current||!currentKey)return;const snapshot={key:currentKey,code:current.code,dept:current.dept,items:JSON.parse(JSON.stringify(items))};try{const r=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?on_conflict=workspace_key`,{method:'POST',headers:{apikey:SUPABASE_KEY,'x-workspace-key':snapshot.key,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({workspace_key:snapshot.key,store_code:snapshot.code,department_name:snapshot.dept,items:snapshot.items,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error(await r.text());if(snapshot.key===currentKey)setStatus('保存済み','ok')}catch(e){console.error(e);if(snapshot.key===currentKey)setStatus('保存失敗','err')}}
function addItem(){if(!current)return;const name=prompt('項目名を入力\n例：ゲーム、PC、スマートウォッチ');if(!name?.trim())return;items.push({id:id(),name:name.trim(),subs:[{id:id(),title:'前提',text:''}]});render();scheduleSave()}
function addSub(itemId){const item=items.find(x=>x.id===itemId);if(!item)return;item.subs.push({id:id(),title:'新しい小項目',text:''});render();scheduleSave()}
function updateItem(itemId,val){const item=items.find(x=>x.id===itemId);if(item){item.name=val;scheduleSave()}}
function updateSub(itemId,subId,key,val){const sub=items.find(x=>x.id===itemId)?.subs.find(x=>x.id===subId);if(sub){sub[key]=val;scheduleSave()}}
function removeItem(itemId){if(!confirm('この項目を削除しますか？'))return;items=items.filter(x=>x.id!==itemId);render();scheduleSave()}
function removeSub(itemId,subId){const item=items.find(x=>x.id===itemId);const sub=item?.subs.find(x=>x.id===subId);if(!sub)return;if(sub.title==='前提'){alert('「前提」は基本小項目のため削除できません');return}item.subs=item.subs.filter(x=>x.id!==subId);render();scheduleSave()}
function render(){document.getElementById('guide').style.display='none';document.getElementById('workspace').style.display='block';document.getElementById('wsTitle').textContent=current.code+'｜'+current.dept;const root=document.getElementById('items');if(!items.length){root.innerHTML='<div class="empty">まだ項目がありません。<br>「＋ 項目追加」からゲーム・PCなどを追加できます。</div>';return}root.innerHTML=items.map(item=>`<div class="item"><div class="itemHead"><input value="${esc(item.name)}" onchange="updateItem('${item.id}',this.value)"><button class="danger tiny" onclick="removeItem('${item.id}')">削除</button></div>${(item.subs||[]).map(sub=>`<div class="sub"><div class="subHead"><input value="${esc(sub.title)}" ${sub.title==='前提'?'readonly':''} onchange="updateSub('${item.id}','${sub.id}','title',this.value)">${sub.title==='前提'?'':`<button class="danger tiny" onclick="removeSub('${item.id}','${sub.id}')">削除</button>`}</div><textarea placeholder="ここに施策・考え方・確認事項を記載" oninput="updateSub('${item.id}','${sub.id}','text',this.value)">${esc(sub.text)}</textarea></div>`).join('')}<div class="actions"><button class="soft" onclick="addSub('${item.id}')">＋ 小項目を追加</button></div></div>`).join('')}
try{const last=JSON.parse(localStorage.getItem('bumonLeaderLast'));if(last?.code&&last?.dept){codeEl.value=last.code;deptEl.value=last.dept;openFromInputs()}}catch{}
</script>
</body></html>
